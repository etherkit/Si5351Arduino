name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update

  compile-sketches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
          - fqbn: rp2040:rp2040:rpipico
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          # examples/si5351_vcxo is excluded: on master it calls get_correction()
          # without the required argument and fails to compile. PR #107 fixes it;
          # add "- examples/si5351_vcxo" back here once #107 is merged.
          sketch-paths: |
            - examples/si5351_calibration
            - examples/si5351_clk67_example
            - examples/si5351_example
            - examples/si5351_ext_ref
            - examples/si5351_outputs
            - examples/si5351_phase
            - examples/si5351_sweeper
          enable-deltas-report: true
          sketches-report-path: sketches-reports
      - uses: actions/upload-artifact@v4
        with:
          name: sketches-report-${{ strategy.job-index }}
          path: sketches-reports

  report-size-deltas:
    if: github.event_name == 'pull_request'
    needs: compile-sketches
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sketches-report-*
          merge-multiple: true
          path: sketches-reports
      - uses: arduino/report-size-deltas@v1
        with:
          sketches-reports-source: sketches-reports

  # Host tests: placeholder. Test design and harnesses are owned by Test Lab;
  # a host-test job will be added in a separate change once Test Lab supplies it.
